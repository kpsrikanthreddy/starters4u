<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Business Coexistence — Starters4U</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid #e2e8f0;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Connecting WhatsApp Business</h2>
    <p id="status-text">Completing onboarding with Starters4U. This window will close automatically...</p>
  </div>

  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var error = params.get('error') || params.get('error_description');

        if (window.opener) {
          window.opener.postMessage({
            type: 'WA_EMBEDDED_SIGNUP_AUTH_RESPONSE',
            code: code,
            error: error
          }, window.location.origin);

          setTimeout(function() {
            window.close();
          }, 1000);
        } else {
          document.getElementById('status-text').innerText =
            code ? 'Authentication successful! You can now close this window.' : 'Authentication error: ' + (error || 'Unknown error');
        }
      } catch (err) {
        console.error('[WhatsApp Callback] Error communicating with opener:', err);
      }
    })();
  </script>
</body>
</html>
